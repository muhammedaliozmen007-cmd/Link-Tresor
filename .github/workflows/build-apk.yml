name: Android-APK bauen

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

# Builds nacheinander ausführen, damit das Release immer die neueste Version enthält
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Link-Tresor.apk

      - name: Als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Link-Tresor-apk
          path: android/Link-Tresor.apk

      - name: Alte Version unter "Releases" entfernen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete android --cleanup-tag --yes --repo ${{ github.repository }} || true

      - name: Als Download unter "Releases" bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          target_commitish: ${{ github.sha }}
          name: Link-Tresor fürs Handy (Android)
          body: |
            **Link-Tresor.apk** auf dem Handy herunterladen und antippen, um sie zu installieren
            (einmalig „Installation aus unbekannten Quellen“ erlauben).
            Spätere Updates direkt in der App über ⋮ → „⬆ Update“.
            Automatisch gebaut aus Commit ${{ github.sha }}.
          prerelease: false
          make_latest: false
          files: android/Link-Tresor.apk
